name: Daily Update

on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 KST — 미국장 마감 후
    - cron: '30 7 * * *'   # 16:30 KST — 한국장 마감 후
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**', '.github/workflows/daily.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-update-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q pipeline/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ok: ${{ steps.collect.outputs.ok }}
      problems: ${{ steps.collect.outputs.problems }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Collect indicators
        id: collect
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 선택. 없으면 키 없는 CSV 경로 사용
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          python pipeline/collect.py --out site/data
          python pipeline/briefing.py site/data
          python pipeline/health.py "$PREVIOUS_DATA_URL" >> "$GITHUB_OUTPUT"

      - name: Render check with collected data (PR)
        if: github.event_name == 'pull_request'
        run: |
          pip install -r pipeline/requirements-dev.txt
          python -m playwright install --with-deps chromium
          cp -r site/data "$RUNNER_TEMP/data"
          SITE_DATA_DIR="$RUNNER_TEMP/data" python -m pytest -q pipeline/tests/test_site.py

      - name: Upload preview (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # 수집 문제가 있으면 이슈를 하나 열어 두고(메일 알림), 모두 정상으로 돌아오면 닫습니다.
  report:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          PROBLEMS: ${{ needs.build.outputs.problems }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const title = '자동 수집 문제 알림';
            const problems = JSON.parse(process.env.PROBLEMS || '[]');
            if (process.env.DEPLOY_RESULT !== 'success') problems.push(`배포 실패 (${process.env.DEPLOY_RESULT})`);
            const { owner, repo } = context.repo;
            try { await github.rest.issues.createLabel({ owner, repo, name: 'data-health', color: 'd93f0b' }); } catch {}
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'data-health' })).data;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (problems.length) {
              const body = `최근 실행: ${run}\n\n아래 지표를 두 번 연속 새로 받지 못해 이전 데이터로 표시 중입니다.\n\n` +
                problems.map(p => `- ${p}`).join('\n') +
                '\n\n하루 이상 계속되면 출처 사이트의 변경이나 장애일 수 있습니다. 모두 복구되면 이 이슈는 자동으로 닫힙니다.';
              if (open.length) await github.rest.issues.update({ owner, repo, issue_number: open[0].number, body });
              else await github.rest.issues.create({ owner, repo, title, body, labels: ['data-health'] });
            } else {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `모든 지표가 정상으로 돌아왔습니다. (${run})` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
              }
            }
